<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <ul>
        {% for prod in produtos %}
            {% if prod["preco"] <= 50 %}
                <li><b>{{ prod }}</b></li>
            
            {% else %}
                <li>{{ prod }}</li>
            {% endif %}
        {% endfor %}
    </ul>

</body>
</html>
